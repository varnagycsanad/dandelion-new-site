          (async () => {
            const all = Array.from(assetEntries.entries()).map(([url, relPath]) => ({ url, relPath }));
            const results = await Promise.all(all.map((entry) => checkUrl(entry.url, entry.relPath)));
            const bad = results.filter((r) => r.status !== 200);
            if (bad.length > 0) {
              const deployAssetsRoot = path.join(process.cwd(), "deploy-assets");
              const repairListPath = path.join(process.cwd(), "repair-assets.txt");
              fs.rmSync(deployAssetsRoot, { recursive: true, force: true });
