        shell: bash
        run: |
          set -euo pipefail
          node <<'EOF'
          const fs = require("node:fs");
          const path = require("node:path");
          const htmlRelativePaths = [
            "index.html",
            "dandelion-d1/index.html",
            "dandelion-d2/index.html",
