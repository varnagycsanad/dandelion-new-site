          const fs = require("node:fs");
          const path = require("node:path");
          const htmlRelativePaths = [
            "index.html",
            "dandelion-d1/index.html",
            "dandelion-d2/index.html",
            "dandelion-koveskal/index.html",
            "dandelion-royal-homes/index.html",
            "dandelion-szepvolgyi-vendeghaz/index.html",
            "dandelion-szololiget/index.html",
            "dandelion-vintage/index.html",
            "dandelion-zsalya/index.html",
            "fuge/index.html",
            "royal/index.html",
            "szepvolgyi/index.html",
            "szololiget/index.html"
          ];
          const distRoot = path.join(process.cwd(), "dist");
          const base = "https://dandelionhouse.hu";
          const assetEntries = new Map();
          const RETRY_DELAYS_MS = [0, 10000, 20000, 30000, 60000, 90000];
          const repairListPath = path.join(process.cwd(), "repair-assets.txt");

          function sleep(ms) {
            return new Promise((resolve) => setTimeout(resolve, ms));
          }

          for (const relPath of htmlRelativePaths) {
            const htmlPath = path.join(distRoot, relPath);
            if (!fs.existsSync(htmlPath)) continue;
            const html = fs.readFileSync(htmlPath, "utf8");
            const rx = /(?:src|href|poster|srcset)=\"([^\"]+)\"/g;
            let m;
            while ((m = rx.exec(html)) !== null) {
              const value = m[1];
              if (value.startsWith("/assets/") && value.match(/\.(webp|jpg|jpeg|png|svg)$/i)) {
                assetEntries.set(base + value, value.replace(/^\/assets\//, ""));
              }
            }
          }

          async function requestUrl(url) {
            let res = await fetch(url, {
              method: "HEAD",
              redirect: "follow",
              headers: { "Cache-Control": "no-cache" }
            });
            if (res.status === 405 || res.status === 501) {
              res = await fetch(url, {
                method: "GET",
                redirect: "follow",
                headers: { "Cache-Control": "no-cache", Range: "bytes=0-0" }
              });
            }
            return res;
          }

          async function checkUrl(url, relPath) {
            let lastStatus = 0;
            let attempt = 0;

            for (const delay of RETRY_DELAYS_MS) {
              attempt += 1;
              if (delay > 0) {
                await sleep(delay);
              }

              try {
                const res = await requestUrl(url);
                lastStatus = res.status;
                if (res.status === 200) {
                  return { url, relPath, status: res.status };
                }

                const cacheBustUrl = `${url}?deploy_check=${Date.now()}-${attempt}`;
                const cacheBustRes = await requestUrl(cacheBustUrl);
                if (cacheBustRes.status === 200) {
                  console.log(`Asset exists at origin but cached status is ${res.status}: ${url}`);
                  return { url, relPath, status: 200, cacheBypassed: true };
                }
                lastStatus = cacheBustRes.status;
              } catch {
                lastStatus = 0;
              }
            }

            return { url, relPath, status: lastStatus };
          }

          (async () => {
            const repairedPaths = fs.existsSync(repairListPath)
              ? fs.readFileSync(repairListPath, "utf8").split(/\r?\n/).map((line) => line.trim()).filter(Boolean)
              : [];
            const all = repairedPaths.length > 0
              ? repairedPaths.map((relPath) => ({ url: `${base}/assets/${relPath}`, relPath }))
              : Array.from(assetEntries.entries()).map(([url, relPath]) => ({ url, relPath }));

            console.log(`Re-checking ${all.length} repaired hashed asset URL(s).`);
            const results = await Promise.all(all.map((entry) => checkUrl(entry.url, entry.relPath)));
            const bad = results.filter((r) => r.status !== 200);
