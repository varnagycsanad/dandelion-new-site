name: Deploy root

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_assets_upload:
        description: Force full hashed assets upload
        required: false
        default: false
        type: boolean
      force_video_upload:
        description: Force full video upload
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-root-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # Required for optional FTP deploy:
      # UJSITE_FTP_HOST: remote FTP host
      # UJSITE_FTP_USER: remote FTP username
      # UJSITE_FTP_PASSWORD: remote FTP password
      # Optional:
      # UJSITE_FTP_PORT: FTP port, defaults to 21 when omitted
      # UJSITE_FTP_PATH: absolute remote target folder for the built site.
      # It should point to the final document root, not the legacy /ujsite/ subdirectory.
      UJSITE_FTP_HOST: ${{ secrets.UJSITE_FTP_HOST }}
      UJSITE_FTP_USER: ${{ secrets.UJSITE_FTP_USER }}
      UJSITE_FTP_PASSWORD: ${{ secrets.UJSITE_FTP_PASSWORD }}
      UJSITE_FTP_PORT: ${{ secrets.UJSITE_FTP_PORT }}
      UJSITE_FTP_PATH: ${{ secrets.UJSITE_FTP_PATH }}
      UJSITE_SSH_HOST: ${{ secrets.UJSITE_SSH_HOST }}
      UJSITE_SSH_PORT: ${{ secrets.UJSITE_SSH_PORT }}
      UJSITE_SSH_USER: ${{ secrets.UJSITE_SSH_USER }}
      UJSITE_SSH_PRIVATE_KEY: ${{ secrets.UJSITE_SSH_PRIVATE_KEY }}
      UJSITE_SSH_PASSPHRASE: ${{ secrets.UJSITE_SSH_PASSPHRASE }}
      UJSITE_SSH_REMOTE_PATH: ${{ secrets.UJSITE_SSH_REMOTE_PATH }}
      GUIDE_AUTH_HTPASSWD_LINE: 'vendeg:$apr1$d2guide1$/u5PMo8OyMbExXGevTKJ./'

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # package.json currently requires Node >=22.12.0, so use stable Node 22 here.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Snapshot current dist
        run: |
          set -euo pipefail
          rm -rf dist-current
          mkdir -p dist-current
          rsync -a dist/ dist-current/

      - name: Prepare guide basic auth files
        shell: bash
        run: |
          set -euo pipefail

          for var_name in UJSITE_SSH_HOST UJSITE_SSH_USER UJSITE_SSH_PRIVATE_KEY UJSITE_SSH_REMOTE_PATH; do
            if [ -z "${!var_name:-}" ]; then
              echo "::error::${var_name} is required because /guide/ is protected by server-side Basic Auth."
              exit 1
            fi
          done

          if [ ! -d dist-current/guide ]; then
            echo "::error::dist-current/guide is missing; cannot prepare guide auth."
            exit 1
          fi

          remote_root="${UJSITE_SSH_REMOTE_PATH%/}"
          auth_file="$(dirname "$remote_root")/.dandelion-guide.htpasswd"

          {
            printf '%s\n' 'AuthType Basic'
            printf '%s\n' 'AuthName "Dandelion Guest Guide"'
            printf '%s\n' 'AuthBasicProvider file'
            printf 'AuthUserFile %s\n' "$auth_file"
            printf '%s\n' 'Require valid-user'
          } > dist-current/guide/.htaccess

      - name: Ensure previous commit is available
        if: github.event_name == 'push' && github.event.before != '' && github.event.before != '0000000000000000000000000000000000000000'
        shell: bash
        run: |
          set -euo pipefail
          BEFORE_SHA="${{ github.event.before }}"
          if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "${BEFORE_SHA}"
          fi

      - name: Build previous dist snapshot
        if: github.event_name == 'push' && github.event.before != '' && github.event.before != '0000000000000000000000000000000000000000'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ../_prev_build
          git worktree add --detach ../_prev_build "${{ github.event.before }}"
          BEFORE_SHA="${{ github.event.before }}"
          CURRENT_SHA="${{ github.sha }}"
          pushd ../_prev_build >/dev/null

          if git -C "${GITHUB_WORKSPACE}" diff --quiet "${BEFORE_SHA}" "${CURRENT_SHA}" -- package.json package-lock.json; then
            ln -s "${GITHUB_WORKSPACE}/node_modules" node_modules
            echo "Reusing current node_modules for previous build snapshot."
          else
            npm ci
          fi

          npm run build
          popd >/dev/null

      - name: Detect accommodation image changes
        if: (env.UJSITE_FTP_HOST != '' && env.UJSITE_FTP_USER != '' && env.UJSITE_FTP_PASSWORD != '' && env.UJSITE_FTP_PATH != '') || (env.UJSITE_SSH_HOST != '' && env.UJSITE_SSH_USER != '' && env.UJSITE_SSH_PRIVATE_KEY != '' && env.UJSITE_SSH_REMOTE_PATH != '')
        id: path_changes
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_assets_upload }}" = "true" ]; then
            echo "assets_force_upload=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "assets_force_upload=false" >> "$GITHUB_OUTPUT"
          elif [ -d ../_prev_build/dist/assets ]; then
            if ! diff -qr dist-current/assets ../_prev_build/dist/assets >/dev/null 2>&1; then
              echo "assets_force_upload=true" >> "$GITHUB_OUTPUT"
            else
              echo "assets_force_upload=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "assets_force_upload=true" >> "$GITHUB_OUTPUT"
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_video_upload }}" = "true" ]; then
            echo "videos_changed=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "videos_changed=false" >> "$GITHUB_OUTPUT"
          else
            BEFORE_SHA="${{ github.event.before }}"
            CURRENT_SHA="${{ github.sha }}"

            if [ -n "${BEFORE_SHA}" ] && [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ] && git diff --name-only "${BEFORE_SHA}" "${CURRENT_SHA}" -- 'public/videos/**' | grep -q .; then
              echo "videos_changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "videos_changed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Prepare site deploy payload
        if: (env.UJSITE_FTP_HOST != '' && env.UJSITE_FTP_USER != '' && env.UJSITE_FTP_PASSWORD != '' && env.UJSITE_FTP_PATH != '') || (env.UJSITE_SSH_HOST != '' && env.UJSITE_SSH_USER != '' && env.UJSITE_SSH_PRIVATE_KEY != '' && env.UJSITE_SSH_REMOTE_PATH != '')
        shell: bash
        run: |
          set -euo pipefail

          deploy_target_path="${UJSITE_SSH_REMOTE_PATH:-${UJSITE_FTP_PATH:-}}"

          case "${deploy_target_path}" in
            ''|*/ujsite|*/ujsite/)
              echo "Deploy target path must point to the final root target, not the legacy /ujsite/ directory." >&2
              exit 1
              ;;
            *)
              ;;
          esac

          mkdir -p deploy-dist
          : > deploy-files.txt
          : > deploy-delete.txt

          if [ -d ../_prev_build/dist ] && [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            rsync -rcn --delete --itemize-changes --out-format='%i|%n' \
              --exclude "_local/" \
              --exclude "assets/" \
              --exclude "images/accommodations/" \
              --exclude "videos/" \
              dist-current/ ../_prev_build/dist/ > dist-delta.txt

            while IFS='|' read -r change path; do
              [ -z "${change:-}" ] && continue

              if [[ "$change" == \*deleting* ]]; then
                # Root deploy should not hard-fail on remote deletions.
                # We prefer leaving stale files over blocking fresh uploads.
                continue
              fi

              if [[ "$change" == '>'* ]] && [ -f "dist-current/$path" ]; then
                mkdir -p "deploy-dist/$(dirname "$path")"
                cp -a "dist-current/$path" "deploy-dist/$path"
                echo "$path" >> deploy-files.txt
              fi
            done < dist-delta.txt
          else
            rsync -av \
              --exclude "_local/" \
              --exclude "assets/" \
              --exclude "images/accommodations/" \
              --exclude "videos/" \
              dist-current/ deploy-dist/

            find deploy-dist -type f -printf '%P\n' > deploy-files.txt
          fi

          if [ -d dist-current/guide ]; then
            rsync -av dist-current/guide/ deploy-dist/guide/
            find deploy-dist/guide -type f -printf 'guide/%P\n' >> deploy-files.txt
          fi

          # [CHANGE 2026-06-05 01:06] Ensure the English Panorama Pool clean URL is deployed after removing the legacy HTML alias.
          if [ -f dist-current/en/panorama-pool/index.html ]; then
            mkdir -p deploy-dist/en/panorama-pool
            cp -a dist-current/en/panorama-pool/index.html deploy-dist/en/panorama-pool/index.html
            echo "en/panorama-pool/index.html" >> deploy-files.txt
          fi

          sort -u deploy-files.txt -o deploy-files.txt
          sort -u deploy-delete.txt -o deploy-delete.txt
          echo "Upload candidates: $(wc -l < deploy-files.txt)"
          echo "Delete candidates intentionally disabled for root deploy."

      - name: Prepare video payload
        if: ((env.UJSITE_FTP_HOST != '' && env.UJSITE_FTP_USER != '' && env.UJSITE_FTP_PASSWORD != '' && env.UJSITE_FTP_PATH != '') || (env.UJSITE_SSH_HOST != '' && env.UJSITE_SSH_USER != '' && env.UJSITE_SSH_PRIVATE_KEY != '' && env.UJSITE_SSH_REMOTE_PATH != '')) && steps.path_changes.outputs.videos_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy-videos
          rsync -av --delete dist/videos/ deploy-videos/

      - name: Prepare full assets payload
        if: ((env.UJSITE_FTP_HOST != '' && env.UJSITE_FTP_USER != '' && env.UJSITE_FTP_PASSWORD != '' && env.UJSITE_FTP_PATH != '') || (env.UJSITE_SSH_HOST != '' && env.UJSITE_SSH_USER != '' && env.UJSITE_SSH_PRIVATE_KEY != '' && env.UJSITE_SSH_REMOTE_PATH != '')) && steps.path_changes.outputs.assets_force_upload == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy-assets
          : > asset-upload.txt
          : > asset-delete.txt

          if [ -d ../_prev_build/dist/assets ] && [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            rsync -rcn --delete --itemize-changes --out-format='%i|%n' \
              dist-current/assets/ ../_prev_build/dist/assets/ > asset-delta.txt

            while IFS='|' read -r change path; do
              [ -z "${change:-}" ] && continue

              if [[ "$change" == \*deleting* ]]; then
                echo "$path" >> asset-delete.txt
                continue
              fi

              if [[ "$change" == '>'* ]] && [ -f "dist-current/assets/$path" ]; then
                mkdir -p "deploy-assets/$(dirname "$path")"
                cp -a "dist-current/assets/$path" "deploy-assets/$path"
                echo "$path" >> asset-upload.txt
              fi
            done < asset-delta.txt
          else
            rsync -av dist-current/assets/ deploy-assets/
            find deploy-assets -type f -printf '%P\n' > asset-upload.txt
          fi

          sort -u asset-upload.txt -o asset-upload.txt
          sort -u asset-delete.txt -o asset-delete.txt
          echo "Asset upload candidates: $(wc -l < asset-upload.txt)"
          echo "Asset delete candidates: $(wc -l < asset-delete.txt)"

      - name: Install lftp
        if: env.UJSITE_FTP_HOST != '' && env.UJSITE_FTP_USER != '' && env.UJSITE_FTP_PASSWORD != '' && env.UJSITE_FTP_PATH != ''
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Resolve FTP port
        if: env.UJSITE_FTP_HOST != '' && env.UJSITE_FTP_USER != '' && env.UJSITE_FTP_PASSWORD != '' && env.UJSITE_FTP_PATH != ''
        id: deploy_port
        shell: bash
        run: |
          if [ -n "${UJSITE_FTP_PORT}" ]; then
            echo "value=${UJSITE_FTP_PORT}" >> "$GITHUB_OUTPUT"
          else
            echo "value=21" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup SSH rsync deploy connection
        id: ssh_setup
        if: env.UJSITE_SSH_HOST != '' && env.UJSITE_SSH_USER != '' && env.UJSITE_SSH_PRIVATE_KEY != '' && env.UJSITE_SSH_REMOTE_PATH != ''
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$UJSITE_SSH_PRIVATE_KEY" > "$HOME/.ssh/ujsite_deploy_key"
          chmod 600 "$HOME/.ssh/ujsite_deploy_key"

          eval "$(ssh-agent -s)"
          {
            echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK"
            echo "SSH_AGENT_PID=$SSH_AGENT_PID"
          } >> "$GITHUB_ENV"

          if [ -n "${UJSITE_SSH_PASSPHRASE:-}" ]; then
            printf '%s\n' \
              '#!/usr/bin/env bash' \
              'printf "%s\n" "$UJSITE_SSH_PASSPHRASE"' \
              > "$RUNNER_TEMP/ssh-askpass.sh"
            chmod 700 "$RUNNER_TEMP/ssh-askpass.sh"

            export SSH_ASKPASS="$RUNNER_TEMP/ssh-askpass.sh"
            export SSH_ASKPASS_REQUIRE=force
            export DISPLAY=:0

            ssh-add "$HOME/.ssh/ujsite_deploy_key" < /dev/null
          else
            ssh-add "$HOME/.ssh/ujsite_deploy_key"
          fi

          try_candidate() {
            local host="$1"
            local port="$2"
            local label="$3"
            local scan_output

            if [ -z "$host" ] || [ -z "$port" ]; then
              return 1
            fi

            if scan_output=$(timeout 10s ssh-keyscan -T 5 -p "$port" -H "$host" 2>/dev/null); then
              if [ -n "$scan_output" ]; then
                printf '%s\n' "$scan_output" >> "$HOME/.ssh/known_hosts"
                SELECTED_SSH_HOST="$host"
                SELECTED_SSH_PORT="$port"
                SELECTED_SSH_LABEL="$label"
                echo "host=$host" >> "$GITHUB_OUTPUT"
                echo "port=$port" >> "$GITHUB_OUTPUT"
                echo "label=$label" >> "$GITHUB_OUTPUT"
                return 0
              fi
            fi

            return 1
          }

          secret_port="${UJSITE_SSH_PORT:-}"
          default_port="22"
          shared_ip_host="185.33.55.51"

          if ! {
            try_candidate "$UJSITE_SSH_HOST" "$secret_port" "secret-host:secret-port" ||
            try_candidate "$UJSITE_SSH_HOST" "$default_port" "secret-host:22" ||
            try_candidate "$shared_ip_host" "$secret_port" "shared-ip:secret-port" ||
            try_candidate "$shared_ip_host" "$default_port" "shared-ip:22"
          }; then
            echo "::error::No SSH host/port candidate returned a host key"
            exit 1
          fi

          echo "selected SSH candidate: $SELECTED_SSH_LABEL"
          remote_path_quoted=$(printf '%q' "$UJSITE_SSH_REMOTE_PATH")
          ssh \
            -i "$HOME/.ssh/ujsite_deploy_key" \
            -p "$SELECTED_SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o LogLevel=ERROR \
            "$UJSITE_SSH_USER@$SELECTED_SSH_HOST" \
            "mkdir -p $remote_path_quoted"

      - name: Install guide basic auth password file
        if: steps.ssh_setup.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail

          remote_root="${UJSITE_SSH_REMOTE_PATH%/}"
          auth_file="$(dirname "$remote_root")/.dandelion-guide.htpasswd"
          auth_dir="$(dirname "$auth_file")"
          auth_dir_quoted="$(printf '%q' "$auth_dir")"
          auth_file_quoted="$(printf '%q' "$auth_file")"

          ssh_options=(
            -i "$HOME/.ssh/ujsite_deploy_key"
            -p "${{ steps.ssh_setup.outputs.port }}"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o LogLevel=ERROR
          )

          printf '%s\n' "$GUIDE_AUTH_HTPASSWD_LINE" | ssh "${ssh_options[@]}" "$UJSITE_SSH_USER@${{ steps.ssh_setup.outputs.host }}" \
            "umask 077; mkdir -p $auth_dir_quoted; cat > $auth_file_quoted; chmod 600 $auth_file_quoted"

      - name: Guard guide auth SSH setup
        if: steps.ssh_setup.outcome != 'success'
        shell: bash
        run: |
          echo "::error::SSH setup is required because /guide/ is protected by server-side Basic Auth."
          exit 1

      - name: Deploy site contents to root over SSH
        id: ssh_root_deploy
        if: steps.ssh_setup.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s deploy-files.txt ]; then
            echo "No root deploy changes detected."
            exit 0
          fi

          ssh_options=(
            -i "$HOME/.ssh/ujsite_deploy_key"
            -p "${{ steps.ssh_setup.outputs.port }}"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o LogLevel=ERROR
          )

          rsync -az --files-from=deploy-files.txt -e "ssh ${ssh_options[*]}" deploy-dist/ "$UJSITE_SSH_USER@${{ steps.ssh_setup.outputs.host }}:$UJSITE_SSH_REMOTE_PATH/"

      - name: Deploy site contents to root over FTP with curl
        if: env.UJSITE_FTP_HOST != '' && env.UJSITE_FTP_USER != '' && env.UJSITE_FTP_PASSWORD != '' && env.UJSITE_FTP_PATH != '' && steps.ssh_root_deploy.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s deploy-files.txt ]; then
            echo "No root deploy changes detected."
            exit 0
          fi

          ftp_port="${UJSITE_FTP_PORT:-21}"
          ftp_root="${UJSITE_FTP_PATH%/}"
          : > failed-root-curl-upload.txt

          while IFS= read -r rel; do
            [ -z "$rel" ] && continue

            remote_url="ftp://${UJSITE_FTP_HOST}:${ftp_port}${ftp_root}/${rel}"
            echo "CURL FTP UPLOAD ${rel}"

            if ! curl --fail --silent --show-error \
              --ftp-pasv \
              --ftp-create-dirs \
              --connect-timeout 20 \
              --max-time 60 \
              --retry 2 \
              --retry-delay 5 \
              --user "${UJSITE_FTP_USER}:${UJSITE_FTP_PASSWORD}" \
              --upload-file "deploy-dist/$rel" \
              "$remote_url"; then
              echo "$rel" >> failed-root-curl-upload.txt
            fi
          done < deploy-files.txt

          if [ -s failed-root-curl-upload.txt ]; then
            echo "Root files failed with curl FTP upload:"
            cat failed-root-curl-upload.txt
            exit 1
          fi

      - name: Deploy site contents to root over FTP
        if: env.UJSITE_SSH_HOST == '' && env.UJSITE_FTP_HOST != '' && env.UJSITE_FTP_USER != '' && env.UJSITE_FTP_PASSWORD != '' && env.UJSITE_FTP_PATH != ''
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s deploy-files.txt ]; then
            echo "No root deploy changes detected."
            exit 0
          fi

          write_root_upload_script() {
            local list_file="$1"
            local script_file="$2"

            cat > "$script_file" <<'LFTP_SETTINGS'
          set ssl:verify-certificate no
          set ftp:passive-mode yes
          set cmd:fail-exit yes
          set net:timeout 45
          set net:max-retries 6
          set net:reconnect-interval-base 10
          set net:reconnect-interval-max 45
          set xfer:clobber on
          LFTP_SETTINGS

            while IFS= read -r rel; do
            [ -z "$rel" ] && continue
            rel_dir="$(dirname "$rel")"
              {
                printf 'echo "UPLOAD %s"\n' "$rel"
                remote_dir="${UJSITE_FTP_PATH%/}"
                if [ "$rel_dir" != "." ]; then
                  remote_dir="${remote_dir}/${rel_dir}"
                  printf 'set cmd:fail-exit no\n'
                  printf 'mkdir -p "%s"\n' "$remote_dir"
                  printf 'set cmd:fail-exit yes\n'
                fi
                printf 'put -O "%s" "%s"\n' "$remote_dir" "deploy-dist/$rel"
              } >> "$script_file"
            done < "$list_file"

            printf 'bye\n' >> "$script_file"
          }

          run_lftp_script() {
            local script_file="$1"
            timeout 90s lftp -u "${UJSITE_FTP_USER},${UJSITE_FTP_PASSWORD}" -p "${{ steps.deploy_port.outputs.value }}" "${UJSITE_FTP_HOST}" -f "$script_file"
          }

          write_root_upload_script deploy-files.txt root-upload.lftp
          if run_lftp_script root-upload.lftp; then
            exit 0
          fi

          echo "Root deploy batch failed; retrying files one by one."
          : > failed-root-upload.txt

          while IFS= read -r rel; do
            [ -z "$rel" ] && continue
            printf '%s\n' "$rel" > root-upload-single.txt
            write_root_upload_script root-upload-single.txt root-upload-single.lftp

            uploaded=false
            for attempt in 1 2 3; do
              echo "Retry root upload ${rel} (attempt ${attempt}/3)"
              if run_lftp_script root-upload-single.lftp; then
                uploaded=true
                break
              fi
              sleep $((attempt * 20))
            done

            if [ "$uploaded" != "true" ]; then
              echo "$rel" >> failed-root-upload.txt
            fi
          done < deploy-files.txt

          if [ -s failed-root-upload.txt ]; then
            echo "Root files still failed after retry:"
            cat failed-root-upload.txt
            exit 1
          fi

      - name: Cleanup previous worktree
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d ../_prev_build ]; then
            git worktree remove --force ../_prev_build || true
            rm -rf ../_prev_build || true
          fi

      - name: Deploy changed hashed assets over SSH
        id: ssh_asset_deploy
        if: steps.ssh_setup.outcome == 'success' && steps.path_changes.outputs.assets_force_upload == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s asset-upload.txt ] && [ ! -s asset-delete.txt ]; then
            echo "No hashed asset changes detected."
            exit 0
          fi

          ssh_options=(
            -i "$HOME/.ssh/ujsite_deploy_key"
            -p "${{ steps.ssh_setup.outputs.port }}"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o LogLevel=ERROR
          )

          remote_assets_path="${UJSITE_SSH_REMOTE_PATH%/}/assets"
          remote_assets_path_quoted=$(printf '%q' "$remote_assets_path")
          ssh "${ssh_options[@]}" "$UJSITE_SSH_USER@${{ steps.ssh_setup.outputs.host }}" "mkdir -p $remote_assets_path_quoted"

          if [ -s asset-upload.txt ]; then
            rsync -az --files-from=asset-upload.txt -e "ssh ${ssh_options[*]}" deploy-assets/ "$UJSITE_SSH_USER@${{ steps.ssh_setup.outputs.host }}:$remote_assets_path/"
          fi

          if [ -s asset-delete.txt ]; then
            while IFS= read -r rel; do
              [ -z "$rel" ] && continue
              remote_file=$(printf '%q' "$remote_assets_path/$rel")
              ssh "${ssh_options[@]}" "$UJSITE_SSH_USER@${{ steps.ssh_setup.outputs.host }}" "rm -f $remote_file"
            done < asset-delete.txt
          fi

      - name: Deploy changed hashed assets over FTP
        if: env.UJSITE_FTP_HOST != '' && env.UJSITE_FTP_USER != '' && env.UJSITE_FTP_PASSWORD != '' && env.UJSITE_FTP_PATH != '' && steps.path_changes.outputs.assets_force_upload == 'true' && steps.ssh_asset_deploy.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s asset-upload.txt ] && [ ! -s asset-delete.txt ]; then
            echo "No hashed asset changes detected."
