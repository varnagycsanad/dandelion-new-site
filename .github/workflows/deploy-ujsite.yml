name: Deploy root

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_assets_upload:
        description: Force full hashed assets upload
        required: false
        default: false
        type: boolean
      force_image_upload:
        description: Force full accommodation image upload
        required: false
        default: false
        type: boolean
      force_video_upload:
        description: Force full accommodation video upload
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-root-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # Required for optional FTP deploy:
      # UJSITE_FTP_HOST: remote FTP host
      # UJSITE_FTP_USER: remote FTP username
      # UJSITE_FTP_PASSWORD: remote FTP password
      # Optional:
      # UJSITE_FTP_PORT: FTP port, defaults to 21 when omitted
      # UJSITE_FTP_PATH: absolute remote target folder for the built site.
      # It should point to the final document root, not the legacy /ujsite/ subdirectory.
      UJSITE_FTP_HOST: ${{ secrets.UJSITE_FTP_HOST }}
      UJSITE_FTP_USER: ${{ secrets.UJSITE_FTP_USER }}
      UJSITE_FTP_PASSWORD: ${{ secrets.UJSITE_FTP_PASSWORD }}
      UJSITE_FTP_PORT: ${{ secrets.UJSITE_FTP_PORT }}
      UJSITE_FTP_PATH: ${{ secrets.UJSITE_FTP_PATH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # package.json currently requires Node >=22.12.0, so use stable Node 22 here.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Snapshot current dist
        run: |
          set -euo pipefail
          rm -rf dist-current
          mkdir -p dist-current
          rsync -a dist/ dist-current/

      - name: Ensure previous commit is available
        if: github.event_name == 'push' && github.event.before != '' && github.event.before != '0000000000000000000000000000000000000000'
        shell: bash
        run: |
          set -euo pipefail
          BEFORE_SHA="${{ github.event.before }}"
          if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "${BEFORE_SHA}"
          fi

      - name: Build previous dist snapshot
        if: github.event_name == 'push' && github.event.before != '' && github.event.before != '0000000000000000000000000000000000000000'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ../_prev_build
          git worktree add --detach ../_prev_build "${{ github.event.before }}"
          pushd ../_prev_build >/dev/null
          npm ci
          npm run build
          popd >/dev/null

      - name: Detect accommodation image changes
        if: env.UJSITE_FTP_HOST != '' && env.UJSITE_FTP_USER != '' && env.UJSITE_FTP_PASSWORD != '' && env.UJSITE_FTP_PATH != ''
        id: path_changes
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_image_upload }}" = "true" ]; then
            echo "images_changed=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "images_changed=false" >> "$GITHUB_OUTPUT"
          else
            BEFORE_SHA="${{ github.event.before }}"
            CURRENT_SHA="${{ github.sha }}"

            if [ -n "${BEFORE_SHA}" ] && [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ] && git diff --name-only "${BEFORE_SHA}" "${CURRENT_SHA}" -- 'public/images/accommodations/**' | grep -q .; then
              echo "images_changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "images_changed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_assets_upload }}" = "true" ]; then
            echo "assets_force_upload=true" >> "$GITHUB_OUTPUT"
          else
            echo "assets_force_upload=false" >> "$GITHUB_OUTPUT"
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_video_upload }}" = "true" ]; then
            echo "videos_changed=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "videos_changed=false" >> "$GITHUB_OUTPUT"
          else
            BEFORE_SHA="${{ github.event.before }}"
            CURRENT_SHA="${{ github.sha }}"

            if [ -n "${BEFORE_SHA}" ] && [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ] && git diff --name-only "${BEFORE_SHA}" "${CURRENT_SHA}" -- 'public/videos/accommodations/**' | grep -q .; then
              echo "videos_changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "videos_changed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Prepare site deploy payload
        if: env.UJSITE_FTP_HOST != '' && env.UJSITE_FTP_USER != '' && env.UJSITE_FTP_PASSWORD != '' && env.UJSITE_FTP_PATH != ''
        shell: bash
        run: |
          set -euo pipefail

          case "${UJSITE_FTP_PATH}" in
            ''|*/ujsite|*/ujsite/)
              echo "UJSITE_FTP_PATH must point to the final root target, not the legacy /ujsite/ directory." >&2
              exit 1
              ;;
            *)
              ;;
          esac

          mkdir -p deploy-dist
          : > deploy-files.txt
          : > deploy-delete.txt

          if [ -d ../_prev_build/dist ] && [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            rsync -rcn --delete --itemize-changes --out-format='%i|%n' \
              --exclude "_local/" \
              --exclude "images/accommodations/" \
              --exclude "videos/accommodations/" \
              dist-current/ ../_prev_build/dist/ > dist-delta.txt

            while IFS='|' read -r change path; do
              [ -z "${change:-}" ] && continue

              if [[ "$change" == \*deleting* ]]; then
                echo "$path" >> deploy-delete.txt
                continue
              fi

              if [[ "$change" == '>'* ]] && [ -f "dist-current/$path" ]; then
                mkdir -p "deploy-dist/$(dirname "$path")"
                cp -a "dist-current/$path" "deploy-dist/$path"
                echo "$path" >> deploy-files.txt
              fi
            done < dist-delta.txt
          else
            rsync -av \
              --exclude "_local/" \
              --exclude "images/accommodations/" \
              --exclude "videos/accommodations/" \
              dist-current/ deploy-dist/

            find deploy-dist -type f -printf '%P\n' > deploy-files.txt
          fi

          sort -u deploy-files.txt -o deploy-files.txt
          sort -u deploy-delete.txt -o deploy-delete.txt
          echo "Upload candidates: $(wc -l < deploy-files.txt)"
          echo "Delete candidates: $(wc -l < deploy-delete.txt)"

      - name: Prepare accommodation image payload
        if: env.UJSITE_FTP_HOST != '' && env.UJSITE_FTP_USER != '' && env.UJSITE_FTP_PASSWORD != '' && env.UJSITE_FTP_PATH != '' && steps.path_changes.outputs.images_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy-images
          rsync -av --delete dist/images/accommodations/ deploy-images/

      - name: Prepare accommodation video payload
        if: env.UJSITE_FTP_HOST != '' && env.UJSITE_FTP_USER != '' && env.UJSITE_FTP_PASSWORD != '' && env.UJSITE_FTP_PATH != '' && steps.path_changes.outputs.videos_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy-videos
          rsync -av --delete dist/videos/accommodations/ deploy-videos/

      - name: Prepare full assets payload
        if: env.UJSITE_FTP_HOST != '' && env.UJSITE_FTP_USER != '' && env.UJSITE_FTP_PASSWORD != '' && env.UJSITE_FTP_PATH != '' && steps.path_changes.outputs.assets_force_upload == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy-assets
          rsync -av --delete dist/assets/ deploy-assets/

      - name: Install lftp
        if: env.UJSITE_FTP_HOST != '' && env.UJSITE_FTP_USER != '' && env.UJSITE_FTP_PASSWORD != '' && env.UJSITE_FTP_PATH != ''
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Resolve FTP port
        if: env.UJSITE_FTP_HOST != '' && env.UJSITE_FTP_USER != '' && env.UJSITE_FTP_PASSWORD != '' && env.UJSITE_FTP_PATH != ''
        id: deploy_port
        shell: bash
        run: |
          if [ -n "${UJSITE_FTP_PORT}" ]; then
            echo "value=${UJSITE_FTP_PORT}" >> "$GITHUB_OUTPUT"
          else
            echo "value=21" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy site contents to root over FTP
        if: env.UJSITE_FTP_HOST != '' && env.UJSITE_FTP_USER != '' && env.UJSITE_FTP_PASSWORD != '' && env.UJSITE_FTP_PATH != ''
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s deploy-files.txt ] && [ ! -s deploy-delete.txt ]; then
            echo "No root deploy changes detected."
            exit 0
          fi

          lftp -u "${UJSITE_FTP_USER},${UJSITE_FTP_PASSWORD}" -p "${{ steps.deploy_port.outputs.value }}" "${UJSITE_FTP_HOST}" <<EOF
          set ssl:verify-certificate no
          $(while IFS= read -r rel; do
            [ -z "$rel" ] && continue
            remote_dir="${UJSITE_FTP_PATH%/}/$(dirname "$rel")"
            if [ "$(dirname "$rel")" = "." ]; then
              remote_dir="${UJSITE_FTP_PATH%/}"
            fi
            printf 'mkdir -p "%s"\n' "$remote_dir"
            printf 'put -O "%s" "%s"\n' "$remote_dir" "deploy-dist/$rel"
          done < deploy-files.txt)
          $(while IFS= read -r rel; do
            [ -z "$rel" ] && continue
            printf 'rm -f "%s/%s"\n' "${UJSITE_FTP_PATH%/}" "$rel"
          done < deploy-delete.txt)
          bye
          EOF

      - name: Validate critical hashed assets
        if: env.UJSITE_FTP_HOST != '' && env.UJSITE_FTP_USER != '' && env.UJSITE_FTP_PASSWORD != '' && env.UJSITE_FTP_PATH != ''
        id: asset_health
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node <<'EOF'
          const fs = require("node:fs");
          const path = require("node:path");
          const pages = [
            "dandelion-d1","dandelion-d2","dandelion-koveskal","dandelion-royal-homes",
            "dandelion-szepvolgyi-vendeghaz","dandelion-szololiget","dandelion-vintage",
            "dandelion-zsalya","fuge","royal","szepvolgyi","szololiget"
          ];
          const distRoot = path.join(process.cwd(), "dist");
          const base = "https://dandelionhouse.hu";
          const urls = new Set();

          for (const page of pages) {
            const htmlPath = path.join(distRoot, page, "index.html");
            if (!fs.existsSync(htmlPath)) continue;
            const html = fs.readFileSync(htmlPath, "utf8");
            const rx = /(?:src|href|poster|srcset)=\"([^\"]+)\"/g;
            let m;
            while ((m = rx.exec(html)) !== null) {
              const value = m[1];
              if (value.startsWith("/assets/") && value.match(/\.(webp|jpg|jpeg|png|svg)$/i)) {
                urls.add(base + value);
              }
            }
          }

          async function checkUrl(url) {
            try {
              const res = await fetch(url, { method: "GET", redirect: "follow" });
              return { url, status: res.status };
            } catch {
              return { url, status: 0 };
            }
          }

          (async () => {
            const all = Array.from(urls);
            const results = await Promise.all(all.map(checkUrl));
            const bad = results.filter((r) => r.status !== 200);
            if (bad.length > 0) {
              console.log(`Broken hashed assets detected: ${bad.length}`);
              for (const item of bad.slice(0, 30)) {
                console.log(`${item.status}\t${item.url}`);
              }
              fs.writeFileSync("asset-health-failed.txt", bad.map((x) => `${x.status}\t${x.url}`).join("\n"));
              process.exit(2);
            }
            console.log(`Hashed assets check passed (${results.length} URLs).`);
          })();
          EOF

      - name: Repair hashed assets over FTP when health-check fails
        if: steps.asset_health.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy-assets
          rsync -av --delete dist/assets/ deploy-assets/
          lftp -u "${UJSITE_FTP_USER},${UJSITE_FTP_PASSWORD}" -p "${{ steps.deploy_port.outputs.value }}" "${UJSITE_FTP_HOST}" <<EOF
          set ssl:verify-certificate no
          mirror -R deploy-assets/ "${UJSITE_FTP_PATH%/}/assets/"
          bye
          EOF

      - name: Re-validate critical hashed assets after repair
        if: always() && steps.asset_health.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          node <<'EOF'
          const fs = require("node:fs");
          const path = require("node:path");
          const pages = [
            "dandelion-d1","dandelion-d2","dandelion-koveskal","dandelion-royal-homes",
            "dandelion-szepvolgyi-vendeghaz","dandelion-szololiget","dandelion-vintage",
            "dandelion-zsalya","fuge","royal","szepvolgyi","szololiget"
          ];
          const distRoot = path.join(process.cwd(), "dist");
          const base = "https://dandelionhouse.hu";
          const urls = new Set();

          for (const page of pages) {
            const htmlPath = path.join(distRoot, page, "index.html");
            if (!fs.existsSync(htmlPath)) continue;
            const html = fs.readFileSync(htmlPath, "utf8");
            const rx = /(?:src|href|poster|srcset)=\"([^\"]+)\"/g;
            let m;
            while ((m = rx.exec(html)) !== null) {
              const value = m[1];
              if (value.startsWith("/assets/") && value.match(/\.(webp|jpg|jpeg|png|svg)$/i)) {
                urls.add(base + value);
              }
            }
          }

          async function checkUrl(url) {
            try {
              const res = await fetch(url, { method: "GET", redirect: "follow" });
              return { url, status: res.status };
            } catch {
              return { url, status: 0 };
            }
          }

          (async () => {
            const results = await Promise.all(Array.from(urls).map(checkUrl));
            const bad = results.filter((r) => r.status !== 200);
            if (bad.length > 0) {
              console.log(`Assets still broken after repair: ${bad.length}`);
              for (const item of bad.slice(0, 30)) {
                console.log(`${item.status}\t${item.url}`);
              }
              process.exit(3);
            }
            console.log(`Assets re-check passed (${results.length} URLs).`);
          })();
          EOF

      - name: Cleanup previous worktree
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d ../_prev_build ]; then
            git worktree remove --force ../_prev_build || true
            rm -rf ../_prev_build || true
          fi

      - name: Deploy accommodation images over FTP
        if: env.UJSITE_FTP_HOST != '' && env.UJSITE_FTP_USER != '' && env.UJSITE_FTP_PASSWORD != '' && env.UJSITE_FTP_PATH != '' && steps.path_changes.outputs.images_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          lftp -u "${UJSITE_FTP_USER},${UJSITE_FTP_PASSWORD}" -p "${{ steps.deploy_port.outputs.value }}" "${UJSITE_FTP_HOST}" <<EOF
          set ssl:verify-certificate no
          mirror -R deploy-images/ "${UJSITE_FTP_PATH%/}/images/accommodations/"
          bye
          EOF

      - name: Deploy full hashed assets over FTP
        if: env.UJSITE_FTP_HOST != '' && env.UJSITE_FTP_USER != '' && env.UJSITE_FTP_PASSWORD != '' && env.UJSITE_FTP_PATH != '' && steps.path_changes.outputs.assets_force_upload == 'true'
        shell: bash
        run: |
          set -euo pipefail
          lftp -u "${UJSITE_FTP_USER},${UJSITE_FTP_PASSWORD}" -p "${{ steps.deploy_port.outputs.value }}" "${UJSITE_FTP_HOST}" <<EOF
          set ssl:verify-certificate no
          mirror -R deploy-assets/ "${UJSITE_FTP_PATH%/}/assets/"
          bye
          EOF

      - name: Deploy accommodation videos over FTP
        if: env.UJSITE_FTP_HOST != '' && env.UJSITE_FTP_USER != '' && env.UJSITE_FTP_PASSWORD != '' && env.UJSITE_FTP_PATH != '' && steps.path_changes.outputs.videos_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          lftp -u "${UJSITE_FTP_USER},${UJSITE_FTP_PASSWORD}" -p "${{ steps.deploy_port.outputs.value }}" "${UJSITE_FTP_HOST}" <<EOF
          set ssl:verify-certificate no
          mirror -R deploy-videos/ "${UJSITE_FTP_PATH%/}/videos/accommodations/"
          bye
          EOF

      - name: Check live root deploy
        if: env.UJSITE_FTP_HOST != '' && env.UJSITE_FTP_USER != '' && env.UJSITE_FTP_PASSWORD != '' && env.UJSITE_FTP_PATH != ''
        run: npm run check:root
