name: Deploy ujsite

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-ujsite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # Required for optional SSH deploy:
      # UJSITE_DEPLOY_HOST: remote SSH host
      # UJSITE_DEPLOY_USER: remote SSH user
      # UJSITE_DEPLOY_SSH_KEY: private key for the SSH user
      # Optional:
      # UJSITE_DEPLOY_PORT: SSH port, defaults to 22 when omitted
      # UJSITE_DEPLOY_PATH: absolute remote target folder for the built site.
      # It should point to the /ujsite/ publish directory, not the WordPress root.
      UJSITE_DEPLOY_HOST: ${{ secrets.UJSITE_DEPLOY_HOST }}
      UJSITE_DEPLOY_USER: ${{ secrets.UJSITE_DEPLOY_USER }}
      UJSITE_DEPLOY_SSH_KEY: ${{ secrets.UJSITE_DEPLOY_SSH_KEY }}
      UJSITE_DEPLOY_PORT: ${{ secrets.UJSITE_DEPLOY_PORT }}
      UJSITE_DEPLOY_PATH: ${{ secrets.UJSITE_DEPLOY_PATH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # package.json currently requires Node >=22.12.0, so use stable Node 22 here.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Prepare deploy payload
        if: env.UJSITE_DEPLOY_HOST != '' && env.UJSITE_DEPLOY_USER != '' && env.UJSITE_DEPLOY_SSH_KEY != '' && env.UJSITE_DEPLOY_PATH != ''
        shell: bash
        run: |
          set -euo pipefail

          case "${UJSITE_DEPLOY_PATH}" in
            */ujsite|*/ujsite/)
              ;;
            *)
              echo "UJSITE_DEPLOY_PATH must point to the /ujsite/ target directory." >&2
              exit 1
              ;;
          esac

          mkdir -p deploy-dist
          rsync -av --delete --exclude "_local/" dist/ deploy-dist/

      - name: Resolve deploy port
        if: env.UJSITE_DEPLOY_HOST != '' && env.UJSITE_DEPLOY_USER != '' && env.UJSITE_DEPLOY_SSH_KEY != '' && env.UJSITE_DEPLOY_PATH != ''
        id: deploy_port
        shell: bash
        run: |
          if [ -n "${UJSITE_DEPLOY_PORT}" ]; then
            echo "value=${UJSITE_DEPLOY_PORT}" >> "$GITHUB_OUTPUT"
          else
            echo "value=22" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy dist contents to /ujsite/ over SSH
        if: env.UJSITE_DEPLOY_HOST != '' && env.UJSITE_DEPLOY_USER != '' && env.UJSITE_DEPLOY_SSH_KEY != '' && env.UJSITE_DEPLOY_PATH != ''
        uses: easingthemes/ssh-deploy@main
        env:
          SSH_PRIVATE_KEY: ${{ env.UJSITE_DEPLOY_SSH_KEY }}
          REMOTE_HOST: ${{ env.UJSITE_DEPLOY_HOST }}
          REMOTE_USER: ${{ env.UJSITE_DEPLOY_USER }}
          REMOTE_PORT: ${{ steps.deploy_port.outputs.value }}
          SOURCE: deploy-dist/
          TARGET: ${{ env.UJSITE_DEPLOY_PATH }}
          ARGS: -rlgoDzvc --delete
