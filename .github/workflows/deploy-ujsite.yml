name: Deploy root

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_assets_upload:
        description: Force full hashed assets upload
        required: false
        default: false
        type: boolean
      force_video_upload:
        description: Force full accommodation video upload
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-root-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # Required for optional FTP deploy:
      # UJSITE_FTP_HOST: remote FTP host
      # UJSITE_FTP_USER: remote FTP username
      # UJSITE_FTP_PASSWORD: remote FTP password
      # Optional:
      # UJSITE_FTP_PORT: FTP port, defaults to 21 when omitted
      # UJSITE_FTP_PATH: absolute remote target folder for the built site.
      # It should point to the final document root, not the legacy /ujsite/ subdirectory.
      UJSITE_FTP_HOST: ${{ secrets.UJSITE_FTP_HOST }}
      UJSITE_FTP_USER: ${{ secrets.UJSITE_FTP_USER }}
      UJSITE_FTP_PASSWORD: ${{ secrets.UJSITE_FTP_PASSWORD }}
      UJSITE_FTP_PORT: ${{ secrets.UJSITE_FTP_PORT }}
      UJSITE_FTP_PATH: ${{ secrets.UJSITE_FTP_PATH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # package.json currently requires Node >=22.12.0, so use stable Node 22 here.
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Snapshot current dist
        run: |
          set -euo pipefail
          rm -rf dist-current
          mkdir -p dist-current
          rsync -a dist/ dist-current/

      - name: Ensure previous commit is available
        if: github.event_name == 'push' && github.event.before != '' && github.event.before != '0000000000000000000000000000000000000000'
        shell: bash
        run: |
          set -euo pipefail
          BEFORE_SHA="${{ github.event.before }}"
          if ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "${BEFORE_SHA}"
          fi

      - name: Build previous dist snapshot
        if: github.event_name == 'push' && github.event.before != '' && github.event.before != '0000000000000000000000000000000000000000'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ../_prev_build
          git worktree add --detach ../_prev_build "${{ github.event.before }}"
          BEFORE_SHA="${{ github.event.before }}"
          CURRENT_SHA="${{ github.sha }}"
          pushd ../_prev_build >/dev/null

          if git -C "${GITHUB_WORKSPACE}" diff --quiet "${BEFORE_SHA}" "${CURRENT_SHA}" -- package.json package-lock.json; then
            ln -s "${GITHUB_WORKSPACE}/node_modules" node_modules
            echo "Reusing current node_modules for previous build snapshot."
          else
            npm ci
          fi

          npm run build
          popd >/dev/null

      - name: Detect accommodation image changes
        if: env.UJSITE_FTP_HOST != '' && env.UJSITE_FTP_USER != '' && env.UJSITE_FTP_PASSWORD != '' && env.UJSITE_FTP_PATH != ''
        id: path_changes
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_assets_upload }}" = "true" ]; then
            echo "assets_force_upload=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "assets_force_upload=false" >> "$GITHUB_OUTPUT"
          elif [ -d ../_prev_build/dist/assets ]; then
            if ! diff -qr dist-current/assets ../_prev_build/dist/assets >/dev/null 2>&1; then
              echo "assets_force_upload=true" >> "$GITHUB_OUTPUT"
            else
              echo "assets_force_upload=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "assets_force_upload=true" >> "$GITHUB_OUTPUT"
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_video_upload }}" = "true" ]; then
            echo "videos_changed=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "videos_changed=false" >> "$GITHUB_OUTPUT"
          else
            BEFORE_SHA="${{ github.event.before }}"
            CURRENT_SHA="${{ github.sha }}"

            if [ -n "${BEFORE_SHA}" ] && [ "${BEFORE_SHA}" != "0000000000000000000000000000000000000000" ] && git diff --name-only "${BEFORE_SHA}" "${CURRENT_SHA}" -- 'public/videos/accommodations/**' | grep -q .; then
              echo "videos_changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "videos_changed=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Prepare site deploy payload
        if: env.UJSITE_FTP_HOST != '' && env.UJSITE_FTP_USER != '' && env.UJSITE_FTP_PASSWORD != '' && env.UJSITE_FTP_PATH != ''
        shell: bash
        run: |
          set -euo pipefail

          case "${UJSITE_FTP_PATH}" in
            ''|*/ujsite|*/ujsite/)
              echo "UJSITE_FTP_PATH must point to the final root target, not the legacy /ujsite/ directory." >&2
              exit 1
              ;;
            *)
              ;;
          esac

          mkdir -p deploy-dist
          : > deploy-files.txt
          : > deploy-delete.txt

          if [ -d ../_prev_build/dist ] && [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            rsync -rcn --delete --itemize-changes --out-format='%i|%n' \
              --exclude "_local/" \
              --exclude "assets/" \
              --exclude "images/accommodations/" \
              --exclude "videos/accommodations/" \
              dist-current/ ../_prev_build/dist/ > dist-delta.txt

            while IFS='|' read -r change path; do
              [ -z "${change:-}" ] && continue

              if [[ "$change" == \*deleting* ]]; then
                # Root deploy should not hard-fail on remote deletions.
                # We prefer leaving stale files over blocking fresh uploads.
                continue
              fi

              if [[ "$change" == '>'* ]] && [ -f "dist-current/$path" ]; then
                mkdir -p "deploy-dist/$(dirname "$path")"
                cp -a "dist-current/$path" "deploy-dist/$path"
                echo "$path" >> deploy-files.txt
              fi
            done < dist-delta.txt
          else
            rsync -av \
              --exclude "_local/" \
              --exclude "assets/" \
              --exclude "images/accommodations/" \
              --exclude "videos/accommodations/" \
              dist-current/ deploy-dist/

            find deploy-dist -type f -printf '%P\n' > deploy-files.txt
          fi

          sort -u deploy-files.txt -o deploy-files.txt
          sort -u deploy-delete.txt -o deploy-delete.txt
          echo "Upload candidates: $(wc -l < deploy-files.txt)"
          echo "Delete candidates intentionally disabled for root deploy."

      - name: Prepare accommodation video payload
        if: env.UJSITE_FTP_HOST != '' && env.UJSITE_FTP_USER != '' && env.UJSITE_FTP_PASSWORD != '' && env.UJSITE_FTP_PATH != '' && steps.path_changes.outputs.videos_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy-videos
          rsync -av --delete dist/videos/accommodations/ deploy-videos/

      - name: Prepare full assets payload
        if: env.UJSITE_FTP_HOST != '' && env.UJSITE_FTP_USER != '' && env.UJSITE_FTP_PASSWORD != '' && env.UJSITE_FTP_PATH != '' && steps.path_changes.outputs.assets_force_upload == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deploy-assets
          : > asset-upload.txt
          : > asset-delete.txt

          if [ -d ../_prev_build/dist/assets ] && [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            rsync -rcn --delete --itemize-changes --out-format='%i|%n' \
              dist-current/assets/ ../_prev_build/dist/assets/ > asset-delta.txt

            while IFS='|' read -r change path; do
              [ -z "${change:-}" ] && continue

              if [[ "$change" == \*deleting* ]]; then
                echo "$path" >> asset-delete.txt
                continue
              fi

              if [[ "$change" == '>'* ]] && [ -f "dist-current/assets/$path" ]; then
                mkdir -p "deploy-assets/$(dirname "$path")"
                cp -a "dist-current/assets/$path" "deploy-assets/$path"
                echo "$path" >> asset-upload.txt
              fi
            done < asset-delta.txt
          else
            rsync -av dist-current/assets/ deploy-assets/
            find deploy-assets -type f -printf '%P\n' > asset-upload.txt
          fi

          sort -u asset-upload.txt -o asset-upload.txt
          sort -u asset-delete.txt -o asset-delete.txt
          echo "Asset upload candidates: $(wc -l < asset-upload.txt)"
          echo "Asset delete candidates: $(wc -l < asset-delete.txt)"

      - name: Install lftp
        if: env.UJSITE_FTP_HOST != '' && env.UJSITE_FTP_USER != '' && env.UJSITE_FTP_PASSWORD != '' && env.UJSITE_FTP_PATH != ''
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y lftp

      - name: Resolve FTP port
        if: env.UJSITE_FTP_HOST != '' && env.UJSITE_FTP_USER != '' && env.UJSITE_FTP_PASSWORD != '' && env.UJSITE_FTP_PATH != ''
        id: deploy_port
        shell: bash
        run: |
          if [ -n "${UJSITE_FTP_PORT}" ]; then
            echo "value=${UJSITE_FTP_PORT}" >> "$GITHUB_OUTPUT"
          else
            echo "value=21" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy site contents to root over FTP
        if: env.UJSITE_FTP_HOST != '' && env.UJSITE_FTP_USER != '' && env.UJSITE_FTP_PASSWORD != '' && env.UJSITE_FTP_PATH != ''
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s deploy-files.txt ]; then
            echo "No root deploy changes detected."
            exit 0
          fi

          lftp -u "${UJSITE_FTP_USER},${UJSITE_FTP_PASSWORD}" -p "${{ steps.deploy_port.outputs.value }}" "${UJSITE_FTP_HOST}" <<EOF
          set ssl:verify-certificate no
          set cmd:fail-exit yes
          set net:timeout 20
          set net:max-retries 2
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 15
          set xfer:clobber on
          $(while IFS= read -r rel; do
            [ -z "$rel" ] && continue
            remote_dir="${UJSITE_FTP_PATH%/}/$(dirname "$rel")"
            if [ "$(dirname "$rel")" = "." ]; then
              remote_dir="${UJSITE_FTP_PATH%/}"
            fi
            printf 'echo "UPLOAD %s"\n' "$rel"
            printf 'set cmd:fail-exit no\n'
            printf 'mkdir -p "%s"\n' "$remote_dir"
            printf 'set cmd:fail-exit yes\n'
            printf 'put -O "%s" "%s"\n' "$remote_dir" "deploy-dist/$rel"
          done < deploy-files.txt)
          bye
          EOF

      - name: Cleanup previous worktree
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d ../_prev_build ]; then
            git worktree remove --force ../_prev_build || true
            rm -rf ../_prev_build || true
          fi

      - name: Deploy changed hashed assets over FTP
        if: env.UJSITE_FTP_HOST != '' && env.UJSITE_FTP_USER != '' && env.UJSITE_FTP_PASSWORD != '' && env.UJSITE_FTP_PATH != '' && steps.path_changes.outputs.assets_force_upload == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s asset-upload.txt ] && [ ! -s asset-delete.txt ]; then
            echo "No hashed asset changes detected."
            exit 0
          fi

          lftp -u "${UJSITE_FTP_USER},${UJSITE_FTP_PASSWORD}" -p "${{ steps.deploy_port.outputs.value }}" "${UJSITE_FTP_HOST}" <<EOF
          set ssl:verify-certificate no
          set cmd:fail-exit yes
          set net:timeout 20
          set net:max-retries 2
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 15
          set xfer:clobber on
          $(while IFS= read -r rel; do
            [ -z "$rel" ] && continue
            remote_dir="${UJSITE_FTP_PATH%/}/assets/$(dirname "$rel")"
            if [ "$(dirname "$rel")" = "." ]; then
              remote_dir="${UJSITE_FTP_PATH%/}/assets"
            fi
            printf 'echo "ASSET UPLOAD %s"\n' "$rel"
            printf 'set cmd:fail-exit no\n'
            printf 'mkdir -p "%s"\n' "$remote_dir"
            printf 'set cmd:fail-exit yes\n'
            printf 'put -O "%s" "%s"\n' "$remote_dir" "deploy-assets/$rel"
          done < asset-upload.txt)
          $(while IFS= read -r rel; do
            [ -z "$rel" ] && continue
            printf 'echo "ASSET DELETE %s"\n' "$rel"
            printf 'rm -f "%s/assets/%s"\n' "${UJSITE_FTP_PATH%/}" "$rel"
          done < asset-delete.txt)
          bye
          EOF

      - name: Validate critical hashed assets
        if: env.UJSITE_FTP_HOST != '' && env.UJSITE_FTP_USER != '' && env.UJSITE_FTP_PASSWORD != '' && env.UJSITE_FTP_PATH != ''
        id: asset_health
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node <<'EOF'
          const fs = require("node:fs");
          const path = require("node:path");
          const htmlRelativePaths = [
            "index.html",
            "dandelion-d1/index.html",
            "dandelion-d2/index.html",
            "dandelion-koveskal/index.html",
            "dandelion-royal-homes/index.html",
            "dandelion-szepvolgyi-vendeghaz/index.html",
            "dandelion-szololiget/index.html",
            "dandelion-vintage/index.html",
            "dandelion-zsalya/index.html",
            "fuge/index.html",
            "royal/index.html",
            "szepvolgyi/index.html",
            "szololiget/index.html"
          ];
          const distRoot = path.join(process.cwd(), "dist");
          const base = "https://dandelionhouse.hu";
          const assetEntries = new Map();

          for (const relPath of htmlRelativePaths) {
            const htmlPath = path.join(distRoot, relPath);
            if (!fs.existsSync(htmlPath)) continue;
            const html = fs.readFileSync(htmlPath, "utf8");
            const rx = /(?:src|href|poster|srcset)=\"([^\"]+)\"/g;
            let m;
            while ((m = rx.exec(html)) !== null) {
              const value = m[1];
              if (value.startsWith("/assets/") && value.match(/\.(webp|jpg|jpeg|png|svg)$/i)) {
                assetEntries.set(base + value, value.replace(/^\/assets\//, ""));
              }
            }
          }

          async function checkUrl(url, relPath) {
            try {
              let res = await fetch(url, { method: "HEAD", redirect: "follow" });
              if (res.status === 405 || res.status === 501) {
                res = await fetch(url, { method: "GET", redirect: "follow", headers: { Range: "bytes=0-0" } });
              }
              return { url, relPath, status: res.status };
            } catch {
              return { url, relPath, status: 0 };
            }
          }

          (async () => {
            const all = Array.from(assetEntries.entries()).map(([url, relPath]) => ({ url, relPath }));
            const results = await Promise.all(all.map((entry) => checkUrl(entry.url, entry.relPath)));
            const bad = results.filter((r) => r.status !== 200);
            if (bad.length > 0) {
              const deployAssetsRoot = path.join(process.cwd(), "deploy-assets");
              const repairListPath = path.join(process.cwd(), "repair-assets.txt");
              fs.rmSync(deployAssetsRoot, { recursive: true, force: true });
              fs.mkdirSync(deployAssetsRoot, { recursive: true });
              fs.writeFileSync(repairListPath, "");

              for (const item of bad) {
                const sourcePath = path.join(distRoot, "assets", item.relPath);
                if (!fs.existsSync(sourcePath)) continue;
                const targetPath = path.join(deployAssetsRoot, item.relPath);
                fs.mkdirSync(path.dirname(targetPath), { recursive: true });
                fs.copyFileSync(sourcePath, targetPath);
                fs.appendFileSync(repairListPath, `${item.relPath}\n`);
              }

              console.log(`Broken hashed assets detected: ${bad.length}`);
              for (const item of bad.slice(0, 30)) {
                console.log(`${item.status}\t${item.url}`);
              }
              fs.writeFileSync("asset-health-failed.txt", bad.map((x) => `${x.status}\t${x.url}`).join("\n"));
              fs.writeFileSync("asset-health-failed-paths.txt", bad.map((x) => x.relPath).join("\n"));
              process.exit(2);
            }
            console.log(`Hashed assets check passed (${results.length} URLs).`);
          })();
          EOF

      - name: Repair hashed assets over FTP when health-check fails
        if: steps.asset_health.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          if [ -f repair-assets.txt ]; then
            tr -d '\r' < repair-assets.txt | sed '/^$/d' | sort -u > repair-assets.normalized.txt
            mv repair-assets.normalized.txt repair-assets.txt
          fi

          if [ ! -s repair-assets.txt ]; then
            echo "No repairable hashed assets were pre-collected."
            echo "Falling back to full assets repair payload."
            rm -rf deploy-assets
            mkdir -p deploy-assets
            rsync -av --delete dist/assets/ deploy-assets/
            find deploy-assets -type f -printf '%P\n' | sort -u > repair-assets.txt
          fi

          lftp -u "${UJSITE_FTP_USER},${UJSITE_FTP_PASSWORD}" -p "${{ steps.deploy_port.outputs.value }}" "${UJSITE_FTP_HOST}" <<EOF
          set ssl:verify-certificate no
          set cmd:fail-exit yes
          set net:timeout 20
          set net:max-retries 2
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 15
          set xfer:clobber on
          $(while IFS= read -r rel; do
            [ -z "$rel" ] && continue
            remote_dir="${UJSITE_FTP_PATH%/}/assets/$(dirname "$rel")"
            if [ "$(dirname "$rel")" = "." ]; then
              remote_dir="${UJSITE_FTP_PATH%/}/assets"
            fi
            printf 'echo "ASSET REPAIR %s"\n' "$rel"
            printf 'set cmd:fail-exit no\n'
            printf 'mkdir -p "%s"\n' "$remote_dir"
            printf 'set cmd:fail-exit yes\n'
            printf 'put -O "%s" "%s"\n' "$remote_dir" "deploy-assets/$rel"
          done < repair-assets.txt)
          bye
          EOF

      - name: Re-validate critical hashed assets after repair
        if: always() && steps.asset_health.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          sleep 10
          node <<'EOF'
          const fs = require("node:fs");
          const path = require("node:path");
          const htmlRelativePaths = [
            "index.html",
            "dandelion-d1/index.html",
            "dandelion-d2/index.html",
            "dandelion-koveskal/index.html",
            "dandelion-royal-homes/index.html",
            "dandelion-szepvolgyi-vendeghaz/index.html",
            "dandelion-szololiget/index.html",
            "dandelion-vintage/index.html",
            "dandelion-zsalya/index.html",
            "fuge/index.html",
            "royal/index.html",
            "szepvolgyi/index.html",
            "szololiget/index.html"
          ];
          const distRoot = path.join(process.cwd(), "dist");
          const base = "https://dandelionhouse.hu";
          const assetEntries = new Map();
          const RETRY_DELAYS_MS = [0, 5000, 10000, 20000];

          function sleep(ms) {
            return new Promise((resolve) => setTimeout(resolve, ms));
          }

          for (const relPath of htmlRelativePaths) {
            const htmlPath = path.join(distRoot, relPath);
            if (!fs.existsSync(htmlPath)) continue;
            const html = fs.readFileSync(htmlPath, "utf8");
            const rx = /(?:src|href|poster|srcset)=\"([^\"]+)\"/g;
            let m;
            while ((m = rx.exec(html)) !== null) {
              const value = m[1];
              if (value.startsWith("/assets/") && value.match(/\.(webp|jpg|jpeg|png|svg)$/i)) {
                assetEntries.set(base + value, value.replace(/^\/assets\//, ""));
              }
            }
          }

          async function checkUrl(url, relPath) {
            let lastStatus = 0;

            for (const delay of RETRY_DELAYS_MS) {
              if (delay > 0) {
                await sleep(delay);
              }

              try {
                let res = await fetch(url, { method: "HEAD", redirect: "follow" });
                if (res.status === 405 || res.status === 501) {
                  res = await fetch(url, { method: "GET", redirect: "follow", headers: { Range: "bytes=0-0" } });
                }

                lastStatus = res.status;
                if (res.status === 200) {
                  return { url, relPath, status: res.status };
                }
              } catch {
                lastStatus = 0;
              }
            }

            return { url, relPath, status: lastStatus };
          }

          (async () => {
            const all = Array.from(assetEntries.entries()).map(([url, relPath]) => ({ url, relPath }));
            const results = await Promise.all(all.map((entry) => checkUrl(entry.url, entry.relPath)));
            const bad = results.filter((r) => r.status !== 200);
            if (bad.length > 0) {
              console.log(`Assets still broken after repair: ${bad.length}`);
              for (const item of bad.slice(0, 30)) {
                console.log(`${item.status}\t${item.url}`);
              }
              process.exit(3);
            }
            console.log(`Assets re-check passed (${results.length} URLs).`);
          })();
          EOF

      - name: Validate critical root public assets
        if: env.UJSITE_FTP_HOST != '' && env.UJSITE_FTP_USER != '' && env.UJSITE_FTP_PASSWORD != '' && env.UJSITE_FTP_PATH != ''
        id: root_public_health
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          node <<'EOF'
          const fs = require("node:fs");
          const path = require("node:path");
          const htmlRelativePaths = [
            "index.html",
            "panorama-pool/index.html",
            "dandelion-d1/index.html",
            "dandelion-d2/index.html",
            "dandelion-koveskal/index.html",
            "dandelion-royal-homes/index.html",
            "dandelion-szepvolgyi-vendeghaz/index.html",
            "dandelion-szololiget/index.html",
            "dandelion-vintage/index.html",
            "dandelion-zsalya/index.html",
            "fuge/index.html",
            "royal/index.html",
            "szepvolgyi/index.html",
            "szololiget/index.html"
          ];
          const distRoot = path.join(process.cwd(), "dist");
          const base = "https://dandelionhouse.hu";
          const rootAssetEntries = new Map();
          const rootPathPattern =
            /^(?:\/images\/|\/scripts\/|\/favicon\.(?:ico|png)|\/robots\.txt|\/deploy-check\.txt)/i;

          function collectCandidate(value) {
            if (!value || value.startsWith("data:") || value.startsWith("mailto:") || value.startsWith("tel:")) {
              return;
            }

            if (value.includes(",")) {
              for (const part of value.split(",")) {
                const candidate = part.trim().split(/\s+/)[0];
                collectCandidate(candidate);
              }
              return;
            }

            let resolvedPath = value;

            try {
              resolvedPath = new URL(value, base).pathname;
            } catch {
              return;
            }

            if (!rootPathPattern.test(resolvedPath) || resolvedPath.startsWith("/assets/")) {
              return;
            }

            rootAssetEntries.set(base + resolvedPath, resolvedPath.replace(/^\//, ""));
          }

          for (const relPath of htmlRelativePaths) {
            const htmlPath = path.join(distRoot, relPath);
            if (!fs.existsSync(htmlPath)) continue;
            const html = fs.readFileSync(htmlPath, "utf8");
            const rx = /(?:src|href|poster|srcset)="([^"]+)"/g;
            let m;
            while ((m = rx.exec(html)) !== null) {
              collectCandidate(m[1]);
            }
          }

          async function checkUrl(url, relPath) {
            try {
              let res = await fetch(url, { method: "HEAD", redirect: "follow" });
              if (res.status === 405 || res.status === 501) {
                res = await fetch(url, { method: "GET", redirect: "follow", headers: { Range: "bytes=0-0" } });
              }
              return { url, relPath, status: res.status };
            } catch {
              return { url, relPath, status: 0 };
            }
          }

          (async () => {
            const all = Array.from(rootAssetEntries.entries()).map(([url, relPath]) => ({ url, relPath }));
            const results = await Promise.all(all.map((entry) => checkUrl(entry.url, entry.relPath)));
            const bad = results.filter((r) => r.status !== 200);
            if (bad.length > 0) {
              const deployDistRoot = path.join(process.cwd(), "deploy-dist");
              const repairListPath = path.join(process.cwd(), "repair-root-files.txt");
              fs.mkdirSync(deployDistRoot, { recursive: true });
              fs.writeFileSync(repairListPath, "");

              for (const item of bad) {
                const sourcePath = path.join(distRoot, item.relPath);
                if (!fs.existsSync(sourcePath)) continue;
                const targetPath = path.join(deployDistRoot, item.relPath);
                fs.mkdirSync(path.dirname(targetPath), { recursive: true });
                fs.copyFileSync(sourcePath, targetPath);
                fs.appendFileSync(repairListPath, `${item.relPath}\n`);
              }

              console.log(`Broken root public assets detected: ${bad.length}`);
              for (const item of bad.slice(0, 30)) {
                console.log(`${item.status}\t${item.url}`);
              }
              fs.writeFileSync("root-public-health-failed.txt", bad.map((x) => `${x.status}\t${x.url}`).join("\n"));
              process.exit(2);
            }
            console.log(`Root public asset check passed (${results.length} URLs).`);
          })();
          EOF

      - name: Repair root public assets over FTP when health-check fails
        if: steps.root_public_health.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          if [ -f repair-root-files.txt ]; then
            tr -d '\r' < repair-root-files.txt | sed '/^$/d' | sort -u > repair-root-files.normalized.txt
            mv repair-root-files.normalized.txt repair-root-files.txt
          fi

          if [ ! -s repair-root-files.txt ]; then
            echo "No repairable root public assets were collected."
            exit 1
          fi

          lftp -u "${UJSITE_FTP_USER},${UJSITE_FTP_PASSWORD}" -p "${{ steps.deploy_port.outputs.value }}" "${UJSITE_FTP_HOST}" <<EOF
          set ssl:verify-certificate no
          set cmd:fail-exit yes
          set net:timeout 20
          set net:max-retries 2
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 15
          set xfer:clobber on
          $(while IFS= read -r rel; do
            [ -z "$rel" ] && continue
            remote_dir="${UJSITE_FTP_PATH%/}/$(dirname "$rel")"
            if [ "$(dirname "$rel")" = "." ]; then
              remote_dir="${UJSITE_FTP_PATH%/}"
            fi
            printf 'echo "ROOT REPAIR %s"\n' "$rel"
            printf 'set cmd:fail-exit no\n'
            printf 'mkdir -p "%s"\n' "$remote_dir"
            printf 'set cmd:fail-exit yes\n'
            printf 'put -O "%s" "%s"\n' "$remote_dir" "deploy-dist/$rel"
          done < repair-root-files.txt)
          bye
          EOF

      - name: Re-validate critical root public assets after repair
        if: always() && steps.root_public_health.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          node <<'EOF'
          const fs = require("node:fs");
          const path = require("node:path");
          const htmlRelativePaths = [
            "index.html",
            "panorama-pool/index.html",
            "dandelion-d1/index.html",
            "dandelion-d2/index.html",
            "dandelion-koveskal/index.html",
            "dandelion-royal-homes/index.html",
            "dandelion-szepvolgyi-vendeghaz/index.html",
            "dandelion-szololiget/index.html",
            "dandelion-vintage/index.html",
            "dandelion-zsalya/index.html",
            "fuge/index.html",
            "royal/index.html",
            "szepvolgyi/index.html",
            "szololiget/index.html"
          ];
          const distRoot = path.join(process.cwd(), "dist");
          const base = "https://dandelionhouse.hu";
          const rootAssetEntries = new Map();
          const rootPathPattern =
            /^(?:\/images\/|\/scripts\/|\/favicon\.(?:ico|png)|\/robots\.txt|\/deploy-check\.txt)/i;

          function collectCandidate(value) {
            if (!value || value.startsWith("data:") || value.startsWith("mailto:") || value.startsWith("tel:")) {
              return;
            }

            if (value.includes(",")) {
              for (const part of value.split(",")) {
                const candidate = part.trim().split(/\s+/)[0];
                collectCandidate(candidate);
              }
              return;
            }

            let resolvedPath = value;

            try {
              resolvedPath = new URL(value, base).pathname;
            } catch {
              return;
            }

            if (!rootPathPattern.test(resolvedPath) || resolvedPath.startsWith("/assets/")) {
              return;
            }

            rootAssetEntries.set(base + resolvedPath, resolvedPath.replace(/^\//, ""));
          }

          for (const relPath of htmlRelativePaths) {
            const htmlPath = path.join(distRoot, relPath);
            if (!fs.existsSync(htmlPath)) continue;
            const html = fs.readFileSync(htmlPath, "utf8");
            const rx = /(?:src|href|poster|srcset)="([^"]+)"/g;
            let m;
            while ((m = rx.exec(html)) !== null) {
              collectCandidate(m[1]);
            }
          }

          async function checkUrl(url, relPath) {
            try {
              let res = await fetch(url, { method: "HEAD", redirect: "follow" });
              if (res.status === 405 || res.status === 501) {
                res = await fetch(url, { method: "GET", redirect: "follow", headers: { Range: "bytes=0-0" } });
              }
              return { url, relPath, status: res.status };
            } catch {
              return { url, relPath, status: 0 };
            }
          }

          (async () => {
            const all = Array.from(rootAssetEntries.entries()).map(([url, relPath]) => ({ url, relPath }));
            const results = await Promise.all(all.map((entry) => checkUrl(entry.url, entry.relPath)));
            const bad = results.filter((r) => r.status !== 200);
            if (bad.length > 0) {
              console.log(`Root public assets still broken after repair: ${bad.length}`);
              for (const item of bad.slice(0, 30)) {
                console.log(`${item.status}\t${item.url}`);
              }
              process.exit(3);
            }
            console.log(`Root public asset re-check passed (${results.length} URLs).`);
          })();
          EOF

      - name: Deploy accommodation videos over FTP
        if: env.UJSITE_FTP_HOST != '' && env.UJSITE_FTP_USER != '' && env.UJSITE_FTP_PASSWORD != '' && env.UJSITE_FTP_PATH != '' && steps.path_changes.outputs.videos_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          lftp -u "${UJSITE_FTP_USER},${UJSITE_FTP_PASSWORD}" -p "${{ steps.deploy_port.outputs.value }}" "${UJSITE_FTP_HOST}" <<EOF
          set ssl:verify-certificate no
          set cmd:fail-exit yes
          set net:timeout 20
          set net:max-retries 2
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 15
          set xfer:clobber on
          mirror -R deploy-videos/ "${UJSITE_FTP_PATH%/}/videos/accommodations/"
          bye
          EOF

      - name: Check live root deploy
        if: env.UJSITE_FTP_HOST != '' && env.UJSITE_FTP_USER != '' && env.UJSITE_FTP_PASSWORD != '' && env.UJSITE_FTP_PATH != ''
        env:
          DND_ROUTE_STABILITY_WARN_ONLY: 'true'
        run: npm run check:root
