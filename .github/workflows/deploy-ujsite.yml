              for (const item of bad.slice(0, 30)) {
                console.log(`${item.status}\t${item.url}`);
              }
              fs.writeFileSync("root-public-health-failed.txt", bad.map((x) => `${x.status}\t${x.url}`).join("\n"));
              process.exit(2);
