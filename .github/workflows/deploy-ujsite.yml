            const html = fs.readFileSync(htmlPath, "utf8");
            const rx = /(?:src|href|poster|srcset)="([^"]+)"/g;
            let m;
            while ((m = rx.exec(html)) !== null) {
              collectCandidate(m[1]);
            }
          }

          async function requestUrl(url) {
            let res = await fetch(url, {
              method: "HEAD",
              redirect: "follow",
              headers: { "Cache-Control": "no-cache" }
            });
            if (res.status === 405 || res.status === 501) {
              res = await fetch(url, {
                method: "GET",
                redirect: "follow",
                headers: { "Cache-Control": "no-cache", Range: "bytes=0-0" }
              });
            }
            return res;
          }

          async function checkUrl(url, relPath) {
            try {
              const res = await requestUrl(url);
              if (res.status === 200) {
                return { url, relPath, status: res.status };
              }

              const cacheBustUrl = `${url}?deploy_check=${Date.now()}`;
              const cacheBustRes = await requestUrl(cacheBustUrl);
              if (cacheBustRes.status === 200) {
                console.log(`Root asset exists at origin but cached status is ${res.status}: ${url}`);
                return { url, relPath, status: 200, cacheBypassed: true };
              }

              return { url, relPath, status: cacheBustRes.status };
            } catch {
              return { url, relPath, status: 0 };
            }
          }

          (async () => {
            const all = Array.from(rootAssetEntries.entries()).map(([url, relPath]) => ({ url, relPath }));
            const results = await Promise.all(all.map((entry) => checkUrl(entry.url, entry.relPath)));
            const bad = results.filter((r) => r.status !== 200);
            if (bad.length > 0) {
              console.log(`Root public assets still broken after repair: ${bad.length}`);
              for (const item of bad.slice(0, 30)) {
                console.log(`${item.status}\t${item.url}`);
              }
              process.exit(3);
            }
            console.log(`Root public asset re-check passed (${results.length} URLs).`);
          })();
          EOF

      - name: Deploy videos over SSH
        id: ssh_video_deploy
        if: steps.ssh_setup.outcome == 'success' && steps.path_changes.outputs.videos_changed == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail

          ssh_options=(
            -i "$HOME/.ssh/ujsite_deploy_key"
            -p "${{ steps.ssh_setup.outputs.port }}"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
            -o LogLevel=ERROR
          )

          remote_videos_path="${UJSITE_SSH_REMOTE_PATH%/}/videos"
          remote_videos_path_quoted=$(printf '%q' "$remote_videos_path")
          ssh "${ssh_options[@]}" "$UJSITE_SSH_USER@${{ steps.ssh_setup.outputs.host }}" "mkdir -p $remote_videos_path_quoted"
          rsync -az --delete -e "ssh ${ssh_options[*]}" deploy-videos/ "$UJSITE_SSH_USER@${{ steps.ssh_setup.outputs.host }}:$remote_videos_path/"

      - name: Deploy videos over FTP
        if: env.UJSITE_FTP_HOST != '' && env.UJSITE_FTP_USER != '' && env.UJSITE_FTP_PASSWORD != '' && env.UJSITE_FTP_PATH != '' && steps.path_changes.outputs.videos_changed == 'true' && steps.ssh_video_deploy.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          lftp -u "${UJSITE_FTP_USER},${UJSITE_FTP_PASSWORD}" -p "${{ steps.deploy_port.outputs.value }}" "${UJSITE_FTP_HOST}" <<EOF
          set ssl:verify-certificate no
          set ftp:passive-mode yes
          set cmd:fail-exit yes
          set net:timeout 45
          set net:max-retries 6
          set net:reconnect-interval-base 10
          set net:reconnect-interval-max 45
          set xfer:clobber on
          mirror -R deploy-videos/ "${UJSITE_FTP_PATH%/}/videos/"
          bye
          EOF

