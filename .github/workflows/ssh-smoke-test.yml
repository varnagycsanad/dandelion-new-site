name: SSH Smoke Test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/ssh-smoke-test.yml

permissions:
  contents: read

jobs:
  ssh-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SSH_HOST: ${{ secrets.UJSITE_SSH_HOST }}
      SSH_PORT: ${{ secrets.UJSITE_SSH_PORT }}
      SSH_USER: ${{ secrets.UJSITE_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.UJSITE_SSH_PRIVATE_KEY }}
      SSH_PASSPHRASE: ${{ secrets.UJSITE_SSH_PASSPHRASE }}
      REMOTE_PATH: ${{ secrets.UJSITE_SSH_REMOTE_PATH }}
    steps:
      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail

          required_vars=(
            SSH_HOST
            SSH_USER
            SSH_PRIVATE_KEY
            REMOTE_PATH
          )

          for var_name in "${required_vars[@]}"; do
            if [ -z "${!var_name:-}" ]; then
              echo "::error::Missing required secret: ${var_name}"
              exit 1
            fi
          done

          for mask_value in \
            "$SSH_HOST" \
            "${SSH_PORT:-}" \
            "$SSH_USER" \
            "$REMOTE_PATH"; do
            if [ -n "$mask_value" ]; then
              echo "::add-mask::$mask_value"
            fi
          done

      - name: Start ssh-agent and load passphrase protected key
        shell: bash
        run: |
          set -euo pipefail

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/ujsite_smoke_test_key"
          chmod 600 "$HOME/.ssh/ujsite_smoke_test_key"

          eval "$(ssh-agent -s)"
          {
            echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK"
            echo "SSH_AGENT_PID=$SSH_AGENT_PID"
          } >> "$GITHUB_ENV"

          if [ -n "${SSH_PASSPHRASE:-}" ]; then
            printf '%s\n' \
              '#!/usr/bin/env bash' \
              'printf "%s\n" "$SSH_PASSPHRASE"' \
              > "$RUNNER_TEMP/ssh-askpass.sh"
            chmod 700 "$RUNNER_TEMP/ssh-askpass.sh"

            export SSH_ASKPASS="$RUNNER_TEMP/ssh-askpass.sh"
            export SSH_ASKPASS_REQUIRE=force
            export DISPLAY=:0

            ssh-add "$HOME/.ssh/ujsite_smoke_test_key" < /dev/null
          else
            ssh-add "$HOME/.ssh/ujsite_smoke_test_key"
          fi

      - name: Discover SSH host key candidate
        shell: bash
        run: |
          set -euo pipefail

          secret_host="$SSH_HOST"
          shared_ip_host="185.33.55.51"
          secret_port="${SSH_PORT:-}"
          default_port="22"

          try_candidate() {
            local host="$1"
            local port="$2"
            local label="$3"
            local scan_output

            echo "candidate: $label"

            if [ -z "$host" ] || [ -z "$port" ]; then
              return 1
            fi

            if scan_output=$(timeout 10s ssh-keyscan -T 5 -p "$port" -H "$host" 2>/dev/null); then
              if [ -n "$scan_output" ]; then
                printf '%s\n' "$scan_output" >> "$HOME/.ssh/known_hosts"
                {
                  echo "SELECTED_SSH_HOST=$host"
                  echo "SELECTED_SSH_PORT=$port"
                  echo "SELECTED_SSH_LABEL=$label"
                } >> "$GITHUB_ENV"
                return 0
              fi
            fi

            return 1
          }

          if try_candidate "$secret_host" "$secret_port" "secret-host:secret-port"; then
            exit 0
          fi

          if try_candidate "$secret_host" "$default_port" "secret-host:22"; then
            exit 0
          fi

          if try_candidate "$shared_ip_host" "$secret_port" "shared-ip:secret-port"; then
            exit 0
          fi

          if try_candidate "$shared_ip_host" "$default_port" "shared-ip:22"; then
            exit 0
          fi

          echo "::error::No SSH host/port candidate returned a host key"
          exit 1

      - name: Run remote smoke test
        shell: bash
        run: |
          set -euo pipefail

          ssh_key_path="$HOME/.ssh/ujsite_smoke_test_key"
          known_hosts_path="$HOME/.ssh/known_hosts"
          remote_path_quoted=$(printf '%q' "$REMOTE_PATH")
          auth_log="$RUNNER_TEMP/ssh-auth-debug.log"

          echo "selected candidate: $SELECTED_SSH_LABEL"

          set +e
          ssh -vvv \
            -i "$ssh_key_path" \
            -p "$SELECTED_SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts_path" \
            -o PreferredAuthentications=publickey,gssapi-keyex,gssapi-with-mic \
            -o LogLevel=DEBUG3 \
            "$SSH_USER@$SELECTED_SSH_HOST" \
            "exit 0" \
            > /dev/null 2> "$auth_log"
          auth_status=$?
          set -e

          echo "auth diagnostic excerpt:"
          grep -E 'ujsite_smoke_test_key|Offering public key|Server accepts key|Authentications that can continue|Next authentication method|Permission denied|sign_and_send_pubkey|identity file' "$auth_log" || true

          if [ "$auth_status" -ne 0 ]; then
            echo "::error::SSH auth diagnostic failed before smoke test"
            exit "$auth_status"
          fi

          ssh \
            -i "$ssh_key_path" \
            -p "$SELECTED_SSH_PORT" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$known_hosts_path" \
            -o LogLevel=ERROR \
            "$SSH_USER@$SELECTED_SSH_HOST" \
            "REMOTE_PATH=$remote_path_quoted bash -lc 'set -e; whoami; pwd; hostname; test -d \"\$REMOTE_PATH\"; ls -la \"\$REMOTE_PATH\" | head; command -v rsync || true; rsync --version | head -1 || true'"

      - name: Cleanup local SSH material
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "${SSH_AGENT_PID:-}" ]; then
            ssh-agent -k >/dev/null
          fi

          rm -f "$HOME/.ssh/ujsite_smoke_test_key" "$RUNNER_TEMP/ssh-askpass.sh"
